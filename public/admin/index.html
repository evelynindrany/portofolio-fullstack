<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Evelyn Indriany</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css">
<style>
body{padding:24px}.box{max-width:960px;margin:0 auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.bar .btn.on{background:var(--pink);color:#17020d;border-color:var(--pink)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 16px;margin-bottom:10px}
.row small{color:var(--mut);display:block}.row .act{display:flex;gap:8px;flex-shrink:0}
.btn.sm{padding:6px 12px;font-size:12px}.f{margin-bottom:14px}
select{width:100%;background:#0a080d;border:1px solid var(--line);border-radius:6px;padding:12px;color:var(--fg);font:14px var(--sans)}
.msg{white-space:pre-wrap;color:var(--mut);margin-top:8px}.unread{border-color:var(--pink)}
#login{max-width:360px;margin:15vh auto}#login input{margin:4px 0 14px}#login .pw-row{display:flex;gap:8px;align-items:center}#login .pw-row input{flex:1;min-width:0}#login .pw-row button{flex-shrink:0;padding:10px 12px}#toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--pink);padding:10px 16px;border-radius:8px;display:none}
.crop-preview{position:relative;max-width:560px;margin-top:12px;overflow:hidden;border:1px solid var(--pink);border-radius:10px;aspect-ratio:16/9;background:#17121a}.crop-preview img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block}.crop-preview span{position:absolute;left:8px;bottom:8px;padding:4px 7px;border-radius:4px;background:#100b12d9;color:#fff;font-size:11px}.crop-control{display:flex;align-items:center;gap:12px}.crop-control input{flex:1;accent-color:var(--pink)}.crop-control output{width:42px;color:var(--mut);font:12px var(--mono)}
</style></head><body>
<form id="login" class="card" autocomplete="on">
  <h3>Admin Login</h3>
  <label for="pw">Password</label>
  <div class="pw-row"><input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required><button class="btn" type="button" id="toggle-pw" aria-pressed="false">Lihat</button></div>
  <button class="btn p" id="go" type="submit">Masuk</button>
  <div id="lerr" style="color:var(--soft)"></div>
</form>
<div class="box" id="app" hidden>
  <div class="bar" id="tabs"></div><div id="view"></div>
</div><div id="toast" role="status"></div>
<script src="/admin/admin.js"></script></body></html>
